# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: CI
run-name: Running continuous integration on ${{ github.actor }}'s commits

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testMigrations:
    name: Test database migrations
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@0d54deb9e9abab9530e4aa889a6c79c88a0ff5c7 # 1.0.99
        with:
          INSTALL_JUST: true
          INSTALL_MIGRATE: "true"

      - name: Test database migrations
        run: bun run .github/scripts/src/test/run-migration-tests.ts

  test:
    name: Run Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pipeline
        uses: tahminator/pipeline/actions/setup@0d54deb9e9abab9530e4aa889a6c79c88a0ff5c7 # 1.0.99
        with:
          LINT_CI: true
          SECRETS: ${{ toJSON(secrets) }}
          INSTALL_JUST: true
          INSTALL_PROTOC: true
          INSTALL_MIGRATE: "true"
          INSTALL_PNPM: true
          PNPM_VERSION: 11.11.0
          CARGO_PACKAGES: |
            cargo-tarpaulin@0.37.2
            sqlx-cli@0.9.0 --no-default-features --features postgres,rustls

      - name: Run Tests
        uses: ./.github/composite/test

  buildUploadClientsImageStaging:
    name: Build and upload beta gRPC clients
    runs-on: ubuntu-26.04
    needs: [test, testMigrations]

    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@0d54deb9e9abab9530e4aa889a6c79c88a0ff5c7 # 1.0.99
        with:
          LINT_CI: true
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}
          INSTALL_PROTO_DEPENDENCIES: true
          INSTALL_JUST: true
          INSTALL_MIGRATE: "true"
          CARGO_PACKAGES: sqlx-cli@0.9.0 --no-default-features --features postgres,rustls

      - name: Prepare SQLx metadata
        run: bun run .github/scripts/src/prepare-sqlx

      - name: Run Tests
        run: cargo test

      - name: Run script
        run: bun run .github/scripts/src/build-clients/beta --sha=${{ github.event.pull_request.head.sha }} --prId=${{ github.event.pull_request.number }}

  buildUploadServerImageStaging:
    name: Build and upload staging gRPC server (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [test, testMigrations]

    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@0d54deb9e9abab9530e4aa889a6c79c88a0ff5c7 # 1.0.99
        with:
          LINT_CI: true
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}
          INSTALL_PROTO_DEPENDENCIES: true
          INSTALL_JUST: true
          INSTALL_MIGRATE: "true"
          CARGO_PACKAGES: sqlx-cli@0.9.0 --no-default-features --features postgres,rustls

      - name: Prepare SQLx metadata
        run: bun run .github/scripts/src/prepare-sqlx

      - name: Run Tests
        run: cargo test

      - name: Run script
        run: bun run .github/scripts/src/build-server/staging --sha=${{ github.event.pull_request.head.sha }} --prId=${{ github.event.pull_request.number }} --arch=${{ matrix.arch }}

  deployStaging:
    name: Deploy to staging
    runs-on: ubuntu-26.04
    needs: [buildUploadServerImageStaging]

    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@aa4f2ffcca89a9dcad96c1eac1e57b5a533f8c26 # 1.0.100
        with:
          SECRETS: ${{ toJSON(secrets) }}
          LINT_CI: true

      - name: Deploy server
        uses: ./.github/composite/deploy-server
        with:
          ENVIRONMENT: staging
          SHA: ${{ github.event.pull_request.head.sha }}

  buildUploadServerImage:
    name: Build gRPC server Docker image and deploy to Docker Hub (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [test, testMigrations]

    if: github.ref_name == 'main'

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pipeline
        uses: tahminator/pipeline/actions/setup@0d54deb9e9abab9530e4aa889a6c79c88a0ff5c7 # 1.0.99
        with:
          LINT_CI: true
          INSTALL_PROTO_DEPENDENCIES: true
          INSTALL_JUST: true
          INSTALL_MIGRATE: "true"
          CARGO_PACKAGES: sqlx-cli@0.9.0 --no-default-features --features postgres,rustls
          SECRETS: ${{ toJSON(secrets) }}

      - name: Prepare SQLx metadata
        run: bun run .github/scripts/src/prepare-sqlx.ts

      - name: Build image
        uses: ./.github/composite/build-server
        with:
          ARCH: ${{ matrix.arch }}

  createTag:
    name: Create new tag
    runs-on: ubuntu-26.04
    needs: [buildUploadServerImage]

    if: github.ref_name == 'main'

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pipeline
        uses: tahminator/pipeline/actions/setup@0d54deb9e9abab9530e4aa889a6c79c88a0ff5c7 # 1.0.99
        with:
          LINT_CI: true
          SECRETS: ${{ toJSON(secrets) }}

      - name: Create new tag
        uses: ./.github/composite/create-tag
