syntax = "proto3";
package members;

import "google/protobuf/timestamp.proto";

option go_package = "patinanetwork.org/grpc/members-grpc-service;members";
option java_package = "org.patinanetwork.grpc.members.v1";
option java_multiple_files = true;

service MembersService {
  rpc getMember(GetMemberRequest) returns (GetMemberResponse);

  rpc listMembers(ListMembersRequest) returns (ListMembersResponse);

  // Distinct careers stored on members, most common first, for UI autocomplete.
  rpc listCareers(ListCareersRequest) returns (ListCareersResponse);

  // Distinct industries stored on members, most common first, for UI
  // autocomplete.
  rpc listIndustries(ListIndustriesRequest) returns (ListIndustriesResponse);

  // Distinct schools stored on members, most common first, for UI autocomplete.
  rpc listSchools(ListSchoolsRequest) returns (ListSchoolsResponse);

  // Distinct grad dates stored on members, most common first, for UI
  // autocomplete.
  rpc listGradDates(ListGradDatesRequest) returns (ListGradDatesResponse);
}

enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_BOARD = 1;
  MEMBER_ROLE_MENTEE = 2;
  MEMBER_ROLE_MENTOR = 3;
}

enum CommunicationMethod {
  COMMUNICATION_METHOD_UNSPECIFIED = 0;
  COMMUNICATION_METHOD_EMAIL = 1;
  COMMUNICATION_METHOD_PHONE_NUMBER = 2;
  COMMUNICATION_METHOD_DISCORD = 3;
  COMMUNICATION_METHOD_INSTAGRAM = 4;
  COMMUNICATION_METHOD_LINKED_IN = 5;
}

// Unordered set of unique communication methods.
message PreferredCommunications {
  repeated CommunicationMethod values = 1;
}

message Member {
  int32 member_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  google.protobuf.Timestamp joined_at = 5;
  optional string discord_id = 6;
  optional string discord_username = 7;
  google.protobuf.Timestamp updated_at = 8;
  optional google.protobuf.Timestamp archived_at = 9;
  // LinkedIn username only (`xyz` for https://www.linkedin.com/in/xyz)
  // must be unique
  optional string linkedin_username = 10;
  // Instagram username only, (no `@`)
  // must be unique
  optional string instagram_username = 11;
  optional string career = 12;
  optional string industry = 13;
  reserved 14;
  optional MemberRole role = 15;
  optional string school = 16;
  optional string grad_date = 17;
  // Absent when no preferences are stored.
  PreferredCommunications preferred_communications = 18;
}

message GetMemberRequest {
  oneof identifier {
    int32 member_id = 1;
    string email = 2;
    string discord_id = 3;
  }
}

message GetMemberResponse { Member member = 1; }

message ListMembersRequest {
  bool include_archived = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListMembersResponse {
  repeated Member members = 1;
  string next_page_token = 2;
}

message ListCareersRequest {
  string query = 1;
  // default of 10, clamps at 50
  uint32 limit = 2;
}

message ListCareersResponse { repeated string careers = 1; }

message ListIndustriesRequest {
  string query = 1;
  // default of 10, clamps at 50
  uint32 limit = 2;
}

message ListIndustriesResponse { repeated string industries = 1; }

message ListSchoolsRequest {
  string query = 1;
  // default of 10, clamps at 50
  uint32 limit = 2;
}
message ListSchoolsResponse { repeated string schools = 1; }

message ListGradDatesRequest {
  string query = 1;
  // default of 10, clamps at 50
  uint32 limit = 2;
}
message ListGradDatesResponse { repeated string grad_dates = 1; }
