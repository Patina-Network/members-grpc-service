name: Deploy server
description: Updates the server image tag in k8s-manifests

inputs:
  RELEASE_TAG:
    description: "Deploy the version named by this tag, for example 1.2.3"
    required: false
    default: ""
  SHA:
    description: "Deploy the image built from this commit. Set exactly one of RELEASE_TAG or SHA."
    required: false
    default: ""
  ENVIRONMENT:
    description: "Environment to deploy to: staging or production"
    required: false
    default: "production"

runs:
  using: composite
  steps:
    - name: Update k8s-manifests
      shell: bash
      run: bun run .github/scripts/src/deploy-server --environment "${{ inputs.ENVIRONMENT }}" --releaseTag "${{ inputs.RELEASE_TAG }}" --sha "${{ inputs.SHA }}"
