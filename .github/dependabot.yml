version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - "/.github/composite/**"
    schedule: { interval: weekly }
  - package-ecosystem: bun
    directory: /.github/scripts
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
